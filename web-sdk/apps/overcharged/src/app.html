<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<!-- proxima-nova font files must be placed in /static/fonts/
			 Required files:
			   proxima-nova-regular.woff2   (weight 400)
			   proxima-nova-semibold.woff2  (weight 600)
			   proxima-nova-bold.woff2      (weight 700)
		-->
		<style>
			@font-face {
				font-family: 'proxima-nova';
				src: url('/fonts/proxima-nova-regular.woff2') format('woff2');
				font-weight: 400;
				font-style: normal;
				font-display: swap;
			}
			@font-face {
				font-family: 'proxima-nova';
				src: url('/fonts/proxima-nova-semibold.woff2') format('woff2');
				font-weight: 600;
				font-style: normal;
				font-display: swap;
			}
			@font-face {
				font-family: 'proxima-nova';
				src: url('/fonts/proxima-nova-bold.woff2') format('woff2');
				font-weight: 700;
				font-style: normal;
				font-display: swap;
			}
		</style>
		<meta name="viewport" content="width=device-width" />
		%sveltekit.head%
	</head>
	<body style="margin: 0; padding: 0; overflow: hidden; background-color: black">
		<div>%sveltekit.body%</div>
	</body>
</html>
